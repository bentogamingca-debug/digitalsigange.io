<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trending Cards Ticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#12151F; --panel:#1C2033; --ink:#F4F5FA; --muted:#8E94AD;
    --up:#3DDC97; --down:#FF6B6B; --gold:#FFD23F;
    --card-h:78vh; /* tweak for your screen */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
  body{display:flex;flex-direction:column;justify-content:center;gap:2.2vh}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:0 3vw}
  header h1{font-size:4.2vh;font-weight:800;letter-spacing:.01em;color:var(--gold)}
  header span{font-size:2.4vh;color:var(--muted)}
  .viewport{overflow:hidden;width:100%}
  .track{display:flex;gap:2vw;width:max-content;padding-left:2vw;
    animation:scroll var(--dur,60s) linear infinite}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .card{flex:none;height:var(--card-h);aspect-ratio:2/3.05;background:var(--panel);
    border-radius:1.2vh;padding:1.4vh;display:flex;flex-direction:column;gap:1vh;
    border-bottom:.7vh solid var(--muted)}
  .card.up{border-bottom-color:var(--up)} .card.down{border-bottom-color:var(--down)}
  .card img{width:100%;flex:1;min-height:0;object-fit:contain}
  .name{font-size:2.6vh;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .set{font-size:1.9vh;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .price{font-size:4vh;font-weight:800}
  .chg{font-size:2.3vh;font-weight:700}
  .up .chg{color:var(--up)} .down .chg{color:var(--down)}
  @media (prefers-reduced-motion:reduce){.track{animation-duration:240s}}
</style>
</head>
<body>
<header><h1>Trending Today</h1><span id="stamp"></span></header>
<div class="viewport"><div class="track" id="track"></div></div>

<script>
/* ---------- CONFIG ---------- */
const CONFIG = {
  DATA_URL: "",          // e.g. "https://your-server.com/trending.json" (see JSON shape below). Empty = use snapshot.
  REFRESH_MS: 5 * 60e3,  // how often to re-pull the feed
  PX_PER_SEC: 90,        // scroll speed
  IMG: id => `https://public.getcollectr.com/public-assets/products/product_${id}.jpg?optimizer=image&format=webp&width=400&quality=80&strip=metadata`
};

/* JSON shape expected from DATA_URL:
   [{ "id":712944, "name":"Pikachu", "set":"30th Celebration", "number":"040/128",
      "price":4.04, "change":-3.13, "pct":-43.65 }, ...]                                   */

/* ---------- SNAPSHOT (Collectr trending, 29 Sep 2026, 30 cards) ---------- */
const SNAPSHOT = [
 {id:712944,name:"Pikachu",set:"30th Celebration",number:"040/128",price:4.04,change:-3.13,pct:-43.65},

 {id:712934,name:"Pikachu",set:"30th Celebration",number:"023/128",price:1.98,change:0.05,pct:2.59},

 {id:712948,name:"Pikachu",set:"30th Celebration",number:"044/128",price:1.62,change:-0.07,pct:-4.14},
 {id:696681,name:"Pikachu",set:"30th Celebration",number:"037/128",price:1.21,change:-0.08,pct:-6.20},
 {id:716317,name:"Pikachu",set:"30th Celebration",number:"051/128",price:1.06,change:-0.23,pct:-17.83},
 {id:716309,name:"Pikachu",set:"30th Celebration",number:"024/128",price:1.09,change:-0.06,pct:-5.22},
 {id:716313,name:"Pikachu",set:"30th Celebration",number:"035/128",price:1.59,change:-0.91,pct:-36.40},
 {id:716318,name:"Pikachu",set:"30th Celebration",number:"052/128",price:1.09,change:-0.58,pct:-34.73}
];

/* ---------- RENDER ---------- */
const track = document.getElementById("track");
const fmt = n => "$" + n.toFixed(2);
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "");

function cardHTML(c){
  const dir = c.change > 0 ? "up" : c.change < 0 ? "down" : "";
  const arrow = c.change > 0 ? "▲" : c.change < 0 ? "▼" : "";
  return `<div class="card ${dir}">
    <img src="${CONFIG.IMG(c.id)}" alt="" onerror="this.style.visibility='hidden'">
    <div class="name">${c.name}</div>
    <div class="set">${c.set} · ${c.number}</div>
    <div class="row"><span class="price">${fmt(c.price)}</span>
      <span class="chg">${arrow} ${Math.abs(c.pct).toFixed(1)}%</span></div>
  </div>`;
}

function render(cards){
  const html = cards.map(cardHTML).join("");
  track.innerHTML = html + html;              // duplicated for a seamless loop
  requestAnimationFrame(() => {
    const half = track.scrollWidth / 2;
    track.style.setProperty("--dur", (half / CONFIG.PX_PER_SEC) + "s");
  });
  document.getElementById("stamp").textContent =
    "Updated " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}

async function refresh(){
  if (!CONFIG.DATA_URL) return;
  try {
    const r = await fetch(CONFIG.DATA_URL, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (Array.isArray(data) && data.length) render(data);
  } catch(e){ console.warn("Feed failed, keeping current cards", e); }
}

render(SNAPSHOT);
refresh();
setInterval(refresh, CONFIG.REFRESH_MS);
</script>
</body>
</html>
