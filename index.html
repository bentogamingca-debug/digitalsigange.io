<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trending Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e17;color:#fff;font-family:Arial,Helvetica,sans-serif}
  #hdr{height:11vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:#141a2b;border-bottom:.4vh solid #f5c518;box-sizing:border-box}
  #hdr h1{margin:0;font-size:4.2vh;letter-spacing:.1em;text-transform:uppercase}
  #meta{font-size:2.4vh;color:#9aa5c4;text-align:right}
  #view{position:relative;height:89vh;overflow:hidden}
  #fadeL,#fadeR{position:absolute;top:0;bottom:0;width:6vw;z-index:2;pointer-events:none}
  #fadeL{left:0;background:linear-gradient(90deg,#0b0e17,transparent)}
  #fadeR{right:0;background:linear-gradient(270deg,#0b0e17,transparent)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5vh;color:#9aa5c4;z-index:1}
  #list{display:flex;height:100%;width:max-content;will-change:transform}
  .row{flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 3vh;border-right:1px solid #222a40}
  .img{height:81vh;width:57.9vh;border-radius:1.5vh;background:#1b2238 center/cover no-repeat;box-shadow:0 0 3vh #000;flex:none}
  .ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:5vh;line-height:1.3;color:#6f7aa0;padding:3vh;box-sizing:border-box}
  .info{margin-left:4vh;width:54vh}
  .name{font-size:6.6vh;line-height:1.15;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .set{font-size:3.8vh;line-height:1.2;color:#9aa5c4;margin-top:1.2vh}
  .rar{font-size:3.2vh;line-height:1.2;color:#6f7aa0;margin-top:.8vh}
  .price{font-size:12vh;line-height:1.1;font-weight:700;margin-top:3.5vh}
  .chg{display:inline-block;margin-top:1.5vh;padding:.9vh 2.4vh;border-radius:5vh;font-size:4.2vh;font-weight:700}
  .up{background:#12351f;color:#3ddc84}
  .dn{background:#401519;color:#ff5c6c}
</style>
</head>
<body>
<div id="hdr"><h1>Trending Today</h1><div id="meta"></div></div>
<div id="view"><div id="fadeL"></div><div id="fadeR"></div><div id="msg"></div><div id="list"></div></div>

<script>
/* ============ SETTINGS ============ */
// Your own Cloudflare Worker address (see worker.js). Tried first when set; public relays are the backup.
var WORKER_URL = "";
var COLLECTR_URL = "https://app.getcollectr.com/?sortType=trendingToday&sortOrder=DESC&category=89&cardType=cards";
var PROXIES = [
  function(u){return "https://corsproxy.io/?url="+encodeURIComponent(u)},
  function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u)}
];
if(WORKER_URL)PROXIES.unshift(function(){return WORKER_URL});

var MAX_CARDS = 30;
var SCROLL_PX_PER_SEC = 60;   // scroll speed
var RELOAD_HOUR = 3;          // full page reload daily at this local hour (0-23)
var DATA_RECHECK_MIN = 60;    // pull fresh Collectr data every N minutes
var FETCH_TIMEOUT_MS = 8000;  // give up on a slow request after this long

// USD -> CAD. Rate is fetched on every refresh; CAD_FALLBACK is used only if all rate lookups fail.
var CAD_FALLBACK = 1.40;
var RATE_URLS = [
  {url:"https://api.frankfurter.dev/v1/latest?base=USD&symbols=CAD", get:function(d){return d.rates.CAD}},
  {url:"https://open.er-api.com/v6/latest/USD", get:function(d){return d.rates.CAD}}
];

/* Built-in backup list (Collectr trending, Oct 14 2026) - shown instantly on load and kept if the live pull fails.
   Row: [id, name, set, rarity, num, price CAD, change CAD, change %, 1 = already CAD]  (converted at 1 USD = 1.42 CAD) */
var S="30th Celebration",IR="Illustration Rare",PR="Pikachu Rare",RAW=[
[652898,"Thousand-Tailed Watcher","Origins","Rare","116/298",27.65,-1.05,-3.66,1],
[652801,"Falling Star","Origins","Rare","029/298",18.22,0.50,2.80,1],
[707648,"Kai'Sa, Survivor","Vendetta","Epic","SP1/006",116.41,-5.38,-4.42,1],
[652990,"Tideturner","Origins","Rare","199/298",3.72,0.31,9.17,1],
[707611,"Astral Heron","Vendetta","Epic","044/166",58.18,2.98,5.40,1],
[652941,"Sabotage","Origins","Rare","156/298",19.10,1.21,6.75,1],
[652876,"Stupefy","Origins","Common","095/298",0.37,0.00,0.00,1],
[652876,"Stupefy","Origins","Common","095/298",1.35,-0.13,-8.65,1],
[705996,"Ahri, Inquisitive","Vendetta","Epic","SP3/006",96.94,-3.44,-3.42,1],
[653094,"Kai'Sa - Daughter of the Void (Alternate Art)","Origins","Showcase","299*/298",4422.32,0.00,0.00,1],
[652812,"Kai'Sa - Survivor","Origins","Epic","039/298",93.83,-1.66,-1.74,1],
[653101,"Ahri - Nine-Tailed Fox (Overnumbered)","Origins","Showcase","303/298",519.04,-0.80,-0.15,1],
[653102,"Ahri - Nine-Tailed Fox (Signature)","Origins","Showcase","303*/298",5270.12,0.00,0.00,1],
[664913,"Ahri - Inquisitive (Signature)","Spiritforged","Showcase","227*/221",4734.98,0.00,0.00,1],
[662898,"Teemo - Scout (GG EZ)","Riftbound Organized Play Promotional Cards","Showcase","197b/298",2031.14,0.00,0.00,1],
[653093,"Kai'Sa - Daughter of the Void (Overnumbered)","Origins","Showcase","299/298",381.55,-7.94,-2.04,1],
[652905,"Time Warp","Origins","Epic","122/298",56.89,-5.55,-8.89,1],
[652813,"Kai'Sa - Survivor (Alternate Art)","Origins","Showcase","039a/298",96.72,-4.29,-4.25,1],
[664881,"Ahri - Inquisitive (Overnumbered)","Spiritforged","Showcase","227/221",941.90,0.00,0.00,1],
[685925,"Baron Nashor (Ultimate)","Unleashed","Showcase","238/219",2596.41,0.00,0.00,1],
[652946,"Dazzling Aurora","Origins","Epic","160/298",43.27,-5.85,-11.91,1],
[652947,"Deadbloom Predator","Origins","Epic","161/298",2.85,0.23,8.65,1],
[652996,"Seal of Discord","Origins","Epic","204/298",46.99,-2.47,-5.00,1],
[653038,"Baited Hook","Origins","Epic","242/298",74.38,-7.61,-9.28,1],
[653104,"Lee Sin - Blind Monk (Alternate Art)","Origins","Showcase","304*/298",1930.60,0.00,0.00,1],
[653098,"Jinx - Loose Cannon (Alternate Art)","Origins","Showcase","301*/298",1904.40,105.72,5.88,1],
[652972,"Stacked Deck","Origins","Uncommon","183/298",0.57,-0.10,-14.89,1],
[652972,"Stacked Deck","Origins","Uncommon","183/298",3.79,-3.56,-48.46,1],
[653113,"Miss Fortune - Bounty Hunter (Overnumbered)","Origins","Showcase","309/298",241.77,-9.63,-3.83,1],
[652855,"Zhonya's Hourglass","Origins","Rare","077/298",24.38,0.27,1.12,1]
].map(function(r){return{id:r[0],name:r[1],set:r[2],rarity:r[3],num:r[4],price:r[5],chg:r[6],pct:r[7],cad:r[8]}});
var BACKUP_DATE = "Oct 14, 2026";   // date of the backup list above (shown when live data isn't available)

var IMG = "https://public.getcollectr.com/public-assets/products/product_{id}.jpg?optimizer=image&format=webp&width=400&quality=80&strip=metadata";

/* ============ ENGINE ============ */
var listEl=document.getElementById("list"),metaEl=document.getElementById("meta"),msgEl=document.getElementById("msg");
var y=0,half=0,last=0,sig="",rate=CAD_FALLBACK,cache=null,live=false,stamp=null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function fetchT(u){
  return Promise.race([fetch(u,{cache:"no-store"}),new Promise(function(_,rej){setTimeout(function(){rej(0)},FETCH_TIMEOUT_MS)})]);
}

function rowHtml(c){
  var up=c.chg>=0,k=c.cad?1:rate,p=c.price*k,ch=Math.abs(c.chg)*k,img=c.img||(c.id?IMG.replace("{id}",c.id):"");
  var sub=[c.rarity,c.num].filter(Boolean).join(" \u2022 ");
  return '<div class="row">'+(img?'<div class="img" style="background-image:url(\''+esc(img)+'\')"></div>':'<div class="img ph">'+esc(c.name)+'<br>'+esc(c.num)+'</div>')+
    '<div class="info"><div class="name">'+esc(c.name)+'</div><div class="set">'+esc(c.set)+'</div><div class="rar">'+esc(sub)+'</div>'+
    '<div class="price">C$'+p.toFixed(2)+'</div>'+
    '<div class="chg '+(up?"up":"dn")+'">'+(up?"\u25B2 +":"\u25BC -")+'C$'+ch.toFixed(2)+' ('+(up?"+":"")+Number(c.pct).toFixed(2)+'%)</div></div></div>';
}

function updMeta(){
  if(live&&stamp)metaEl.textContent="Last updated: "+stamp.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  else metaEl.textContent="Last updated: "+BACKUP_DATE+" (backup data)";
}

function render(cards){
  cards=cards.slice(0,MAX_CARDS);
  cache=cards;
  var s=JSON.stringify(cards)+rate;
  if(s===sig)return; sig=s;
  var h=cards.map(rowHtml).join("");
  listEl.innerHTML=h+h;            // duplicated for a seamless loop
  msgEl.style.display="none";
  y=0;
  setTimeout(function(){half=listEl.scrollWidth/2},300);
}

function tick(t){
  if(!last)last=t;
  var dt=(t-last)/1000;last=t;
  if(half>0){y+=SCROLL_PX_PER_SEC*dt;if(y>=half)y-=half;listEl.style.transform="translate3d("+(-y)+"px,0,0)"}
  requestAnimationFrame(tick);
}

function getRate(){
  var i=0;
  function next(){
    if(i>=RATE_URLS.length)return Promise.resolve();
    var r=RATE_URLS[i++];
    return fetchT(r.url).then(function(x){return x.json()}).then(function(d){
      var v=Number(r.get(d));if(!(v>0.5&&v<5))throw 0;rate=v;
    }).catch(next);
  }
  return next();
}

function parseCollectr(html){
  var doc=new DOMParser().parseFromString(html,"text/html"),out=[],seen={};
  var imgs=doc.querySelectorAll('img[src*="product_"]');
  for(var i=0;i<imgs.length;i++){
    var m=imgs[i].getAttribute("src").match(/product_(\d+)/);
    if(!m||seen[m[1]])continue;
    var li=imgs[i].closest("li")||imgs[i].parentNode.parentNode,tx=[],n;
    var w=doc.createTreeWalker(li,NodeFilter.SHOW_TEXT,null);
    while((n=w.nextNode())){var t=n.nodeValue.replace(/\s+/g," ").trim();if(t)tx.push(t)}
    var j=tx.join(" "),pm=j.match(/\$([\d,]+\.\d{2})/),cm=j.match(/([+-])\s*\$([\d,]+\.\d{2})\s*\(\s*([+-]?[\d.]+)%/);
    if(!pm||tx.length<3)continue;
    var line="";for(var k=0;k<tx.length;k++){if(tx[k].indexOf("\u2022")>-1){line=tx[k];break}}
    var parts=line.split("\u2022"),rar=(parts[0]||"").trim(),rest=(parts[1]||"").trim();
    var nm=rest.match(/^(\d+(?:\/\d+)?)/),num=nm?nm[1]:rest.replace(/(Reverse )?(Holofoil|Normal)$/i,"").trim();
    if(/^none$/i.test(rar))rar="";
    var sg=cm&&cm[1]==="-"?-1:1;
    seen[m[1]]=1;
    out.push({id:+m[1],name:tx[0].replace(/\s+-\s+\S+\s*\(.*\)\s*$/,""),set:tx[1],rarity:rar,num:num,
      price:parseFloat(pm[1].replace(/,/g,"")),
      chg:cm?sg*parseFloat(cm[2].replace(/,/g,"")):0,
      pct:cm?sg*Math.abs(parseFloat(cm[3])):0});
  }
  return out;
}

// Asks every relay at once; the first good answer wins.
function getCollectr(){
  return new Promise(function(res,rej){
    var fails=0,done=false;
    PROXIES.forEach(function(px){
      fetchT(px(COLLECTR_URL)).then(function(r){if(!r.ok)throw 0;return r.text()})
        .then(function(h){var l=parseCollectr(h);if(l.length<10)throw 0;return l})
        .then(function(l){if(!done){done=true;res(l)}})
        .catch(function(){if(++fails===PROXIES.length&&!done)rej()});
    });
  });
}

function load(){
  getRate().then(function(){if(cache)render(cache)});
  getCollectr().then(function(l){live=true;stamp=new Date();render(l);updMeta()}).catch(updMeta);
}

function scheduleDailyReload(){
  var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),RELOAD_HOUR,0,0);
  if(t<=n)t.setDate(t.getDate()+1);
  setTimeout(function(){location.reload()},t-n);
}

render(RAW);updMeta();
load();
setInterval(load,DATA_RECHECK_MIN*60000);
scheduleDailyReload();
requestAnimationFrame(tick);
window.addEventListener("resize",function(){half=listEl.scrollWidth/2});
</script>
</body>
</html>
